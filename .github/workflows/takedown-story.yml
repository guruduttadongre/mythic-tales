name: Take Down Story

on:
  workflow_dispatch:
    inputs:
      story_file:
        description: 'Path to the story file to take down (e.g. content/hanuman-leap-of-faith.md)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  takedown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Take down story
        env:
          STORY_FILE: ${{ inputs.story_file }}
        run: python3 scripts/takedown_story.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: take down story - ${{ inputs.story_file }}" || echo "Nothing to commit"
          git push
