name: Generate Story Thumbnail

on:
  push:
    branches: [main]
    paths:
      - 'content/*.md'
  workflow_dispatch:
    inputs:
      story_file:
        description: 'Path to the story file (e.g. content/crocodile-monkey-and-the-jamun-fruit.md)'
        required: true
        type: string
      visual_override:
        description: 'Optional specific guidance for the image (overrides auto-inferred context)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-thumbnail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine story file
        id: find-story
        run: |
          if [ -n "${{ inputs.story_file }}" ]; then
            echo "story_file=${{ inputs.story_file }}" >> "$GITHUB_OUTPUT"
          else
            FILE=$(git diff --name-only --diff-filter=A ${{ github.event.before }} ${{ github.event.after }} -- content/*.md | head -1)
            if [ -z "$FILE" ]; then
              echo "No newly added story file found in this push."
              exit 1
            fi
            echo "story_file=$FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate thumbnail
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STORY_FILE: ${{ steps.find-story.outputs.story_file }}
          VISUAL_OVERRIDE: ${{ inputs.visual_override }}
        run: python3 scripts/generate_thumbnail.py

      - name: Open pull request for review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "content: generate thumbnail image"
          branch: "thumbnail/${{ github.run_id }}"
          title: "Thumbnail image review"
          body: |
            Automated thumbnail image for review. This PR only touches the
            image file - story content is unaffected.

            Merge to approve. Close to reject, then manually re-run this
            workflow with a visual override if you want to steer the result.
          labels: image-review
